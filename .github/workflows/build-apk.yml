name: Build Stashspace APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Android SDK
      run: |
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd $ANDROID_HOME/cmdline-tools
        curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o tools.zip
        unzip -q tools.zip
        mkdir -p latest
        mv bin latest/
        mv lib latest/
        mv N lib64/ 2>/dev/null || mv lib64/lib 64bit/ 2>/dev/null || true
        mv lib lib64/ 2>/dev/null || true
        mv NOTICE* NOTICE.txt 2>/dev/null || true
        mv LICENSE* LICENSE.txt 2>/dev/null || true
        mv source.properties 2>/dev/null || true
        mv NOTICE.txt 2>/dev/null || true
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "build-tools;35.0.0" "platforms;android-35" "platform-tools" --sdk_root=$ANDROID_HOME
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses --sdk_root=$ANDROID_HOME || true

    - name: Build APK
      run: ./gradlew assembleDebug -x test

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: stashspace-debug-apk
        path: app/build/outputs/apk/debug/