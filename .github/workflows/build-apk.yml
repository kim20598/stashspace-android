name: Build Stashspace APK

on:
  push:
    branches: [ main, master, 'build-*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'App version code'
        required: false
        default: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: reactivecircus/android-build@v2
      with:
        api-level: 35
        build-tools: 35.0.0

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug -x test

    - name: Extract APK info
      id: apk-info
      run: |
        APK_PATH=app/build/outputs/apk/debug/app-debug.apk
        if [ -f "$APK_PATH" ]; then
          APK_SIZE=$(stat -f%z "$APK_PATH" 2>/dev/null || stat -c%s "$APK_PATH")
          echo "size=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: stashspace-debug-apk
        path: app/build/outputs/apk/debug/
        
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: stashspace-${{ github.sha }}-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30